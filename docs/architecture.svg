<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 434" width="1000" height="434" role="img" aria-label="The notes app on AWS Emulator: the browser reaches one CloudFront origin, which serves the page from a private S3 bucket and sends /api/* to an HTTP API, a Lambda function and a DynamoDB table.">
<style>
  text { font-family:"IBM Plex Sans","Inter","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .n { stroke-width:1.2; }
  .n.dash { stroke-dasharray:5 4; stroke-width:1.3; }
  .ab { font-family:"IBM Plex Mono","JetBrains Mono","Noto Sans Mono",ui-monospace,Menlo,monospace; font-size:8.5px; font-weight:600; fill:#fff; }
  .t { font-size:12px; font-weight:600; }
  .s { font-size:10.5px; }
  .gt { font-size:12px; font-weight:600; }
  .grp, .pub, .priv, .iso { stroke-width:1; }
  .region { fill:none; stroke:#00A4A6; stroke-width:1.4; stroke-dasharray:7 5; }
  .vpc { fill:none; stroke:#8C4FFF; stroke-width:1.4; }
  .pub { stroke:#7AA116; } .priv { stroke:#00A4A6; } .iso { stroke:#147EBA; }
  text.reg { fill:#00A4A6; } text.vpcl { fill:#8C4FFF; }
  text.publ { fill:#7AA116; } text.privl { fill:#00A4A6; } text.isol { fill:#147EBA; }
  .sl { font-family:"IBM Plex Mono","JetBrains Mono","Noto Sans Mono",ui-monospace,Menlo,monospace; font-size:10.5px; letter-spacing:.06em; }
  .ar { fill:none; stroke-width:1.4; }
  .ar.thin { stroke-dasharray:3 3; }
  .ar.bad { stroke:#DD344C; }
  .al { font-size:10.5px; paint-order:stroke; stroke-width:3px; stroke-linejoin:round; }
  .lg { font-size:11px; }
  .ghost { opacity:.28; }
  .ring { fill:none; stroke-width:2.2; }
  .down { stroke:#DD344C; stroke-width:1.4; stroke-dasharray:6 4; }
  .dn { font-size:11px; font-weight:700; fill:#DD344C; }
  .ft { font-size:14px; font-weight:700; }
  .fs { font-size:11.5px; }
  .note { font-size:11px; font-style:italic; }

  .bg { fill:#F3F6F8; }
  .n { fill:#FFFFFF; stroke:#C6D0D9; }
  .n.dash { stroke:#15202B; }
  .t, .gt, .ft { fill:#15202B; }
  .s, .sl, .al, .lg, .fs, .note { fill:#5A6877; }
  .al { stroke:#F3F6F8; }
  .grp { fill:#F7F9FB; stroke:#C6D0D9; }
  .pub { fill:rgba(122,161,22,.07); } .priv { fill:rgba(0,164,166,.06); } .iso { fill:rgba(20,126,186,.07); }
  .ar { stroke:#5A6877; } .mk { fill:#5A6877; } .mkbad { fill:#DD344C; }
  .ring { stroke:#D69E2E; }
  .down { fill:rgba(221,52,76,.07); }
  @media (prefers-color-scheme: dark) {
  .bg { fill:#0E141A; }
    .n { fill:#161F28; stroke:#344352; }
    .n.dash { stroke:#E2E8EE; }
    .t, .gt, .ft { fill:#E2E8EE; }
    .s, .sl, .al, .lg, .fs, .note { fill:#95A3B1; }
    .al { stroke:#0E141A; }
    .grp { fill:#121A22; stroke:#344352; }
    .pub { fill:rgba(122,161,22,.10); } .priv { fill:rgba(0,164,166,.09); } .iso { fill:rgba(20,126,186,.12); }
    .ar { stroke:#95A3B1; } .mk { fill:#95A3B1; } .mkbad { fill:#DD344C; }
    .ring { stroke:#F6C453; }
    .down { fill:rgba(221,52,76,.12); }
  }
</style>
<defs>
  <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0,0 L10,5 L0,10 z"/></marker>
  <marker id="hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkbad" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="1000" height="434" rx="10"/>
<g transform="translate(0,0)">
<rect class="region" x="178" y="8" width="808" height="384" rx="8"/>
<text class="gt reg" x="190" y="27" text-anchor="start">AWS Emulator on https://127.0.0.1:9297, account 000000000000</text>
<rect class="n" x="14" y="168" width="130" height="44" rx="6"/>
<rect x="22" y="176" width="28" height="28" rx="4" fill="#5A6877"/>
<text class="ab" x="36" y="193.5" text-anchor="middle">WEB</text>
<text class="t" x="58" y="187">browser</text>
<text class="s" x="58" y="202">notes page</text>
<rect class="n" x="196" y="168" width="164" height="44" rx="6"/>
<rect x="204" y="176" width="28" height="28" rx="4" fill="#8C4FFF"/>
<text class="ab" x="218" y="193.5" text-anchor="middle">CF</text>
<text class="t" x="240" y="187">CloudFront</text>
<text class="s" x="240" y="202">one origin for all</text>
<rect class="n" x="196" y="320" width="164" height="44" rx="6"/>
<rect x="204" y="328" width="28" height="28" rx="4" fill="#7AA116"/>
<text class="ab" x="218" y="345.5" text-anchor="middle">S3</text>
<text class="t" x="240" y="339">S3 bucket</text>
<text class="s" x="240" y="354">private: the page</text>
<rect class="n" x="405" y="168" width="170" height="44" rx="6"/>
<rect x="413" y="176" width="28" height="28" rx="4" fill="#8C4FFF"/>
<text class="ab" x="427" y="193.5" text-anchor="middle">API</text>
<text class="t" x="449" y="187">API Gateway</text>
<text class="s" x="449" y="202">HTTP API, /api/notes</text>
<rect class="n" x="630" y="168" width="170" height="44" rx="6"/>
<rect x="638" y="176" width="28" height="28" rx="4" fill="#ED7100"/>
<text class="ab" x="652" y="193.5" text-anchor="middle">λ</text>
<text class="t" x="674" y="187">Lambda</text>
<text class="s" x="674" y="202">python3.12</text>
<rect class="n" x="836" y="168" width="136" height="44" rx="6"/>
<rect x="844" y="176" width="28" height="28" rx="4" fill="#C925D1"/>
<text class="ab" x="858" y="193.5" text-anchor="middle">DDB</text>
<text class="t" x="880" y="187">DynamoDB</text>
<text class="s" x="880" y="202">notes table</text>
<rect class="n" x="630" y="48" width="170" height="44" rx="6"/>
<rect x="638" y="56" width="28" height="28" rx="4" fill="#DD344C"/>
<text class="ab" x="652" y="73.5" text-anchor="middle">IAM</text>
<text class="t" x="674" y="67">IAM role</text>
<text class="s" x="674" y="82">PutItem, Query only</text>
<rect class="n" x="630" y="320" width="170" height="44" rx="6"/>
<rect x="638" y="328" width="28" height="28" rx="4" fill="#E7157B"/>
<text class="ab" x="652" y="345.5" text-anchor="middle">CW</text>
<text class="t" x="674" y="339">CloudWatch Logs</text>
<text class="s" x="674" y="354">kept 7 days</text>
<path class="ar" d="M144,190 H194" marker-end="url(#h)"/>
<path class="ar" d="M278,212 V318" marker-end="url(#h)"/>
<text class="al" x="323" y="270" text-anchor="middle">/ signed by OAC</text>
<path class="ar" d="M360,190 H403" marker-end="url(#h)"/>
<text class="al" x="382" y="180" text-anchor="middle">/api/*</text>
<path class="ar" d="M575,190 H628" marker-end="url(#h)"/>
<text class="al" x="602" y="180" text-anchor="middle">proxy</text>
<path class="ar" d="M800,190 H834" marker-end="url(#h)"/>
<path class="ar thin" d="M715,92 V166" marker-end="url(#h)"/>
<text class="al" x="752" y="132" text-anchor="middle">assumed by</text>
<path class="ar thin" d="M715,212 V318" marker-end="url(#h)"/>
<text class="al" x="740" y="270" text-anchor="middle">prints</text>
</g>
<rect x="20" y="410" width="12" height="12" rx="3" fill="#5A6877"/>
<text class="lg" x="38" y="420">you</text>
<rect x="78.6" y="410" width="12" height="12" rx="3" fill="#8C4FFF"/>
<text class="lg" x="96.6" y="420">edge and API</text>
<rect x="193.0" y="410" width="12" height="12" rx="3" fill="#7AA116"/>
<text class="lg" x="211.0" y="420">files</text>
<rect x="264.0" y="410" width="12" height="12" rx="3" fill="#ED7100"/>
<text class="lg" x="282.0" y="420">code</text>
<rect x="328.8" y="410" width="12" height="12" rx="3" fill="#C925D1"/>
<text class="lg" x="346.8" y="420">data</text>
<rect x="393.6" y="410" width="12" height="12" rx="3" fill="#DD344C"/>
<text class="lg" x="411.6" y="420">permissions</text>
<rect x="501.8" y="410" width="12" height="12" rx="3" fill="#E7157B"/>
<text class="lg" x="519.8" y="420">logs</text>
</svg>
